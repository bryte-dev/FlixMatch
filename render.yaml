services:
  - type: web
    name: flixmatch
    runtime: node
    plan: free
    rootDir: flixmatch
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PUBLIC_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OMDB_API_KEY
        sync: false
      # PostHog (facultatif) : lus au build par Vite et au démarrage par le serveur (CSP)
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        sync: false
